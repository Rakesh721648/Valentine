<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f7b4bc, #f7c7bd);
      position: relative;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      bottom: -30px;
      opacity: .45;
      animation: floatUp linear forwards;
      font-size: 18px;
    }
    @keyframes floatUp {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: .45; }
      to { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
    }

    .card {
      width: min(90vw, 430px);
      min-height: 420px;
      background: rgba(255,255,255,.96);
      border-radius: 28px;
      padding: 42px 30px 35px;
      text-align: center;
      box-shadow: 0 22px 55px rgba(135, 49, 77, .20);
      position: relative;
      z-index: 2;
      animation: pop .65s ease-out;
    }
    @keyframes pop {
      from { transform: scale(.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .emoji {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 28px;
      color: #29202a;
      font-size: clamp(25px, 7vw, 36px);
      line-height: 1.2;
    }
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      min-height: 58px;
      position: relative;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 30px;
      font-size: 17px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    #yes {
      color: white;
      background: #e83e78;
      box-shadow: 0 9px 20px rgba(232,62,120,.28);
    }
    #yes:hover { transform: translateY(-2px) scale(1.04); }
    #no {
      color: #4a4248;
      background: #f0eef0;
      position: relative;
    }
    .hint {
      margin-top: 18px;
      color: #71666e;
      font-size: 14px;
    }

    .success { display: none; }
    .success .emoji { font-size: 72px; }
    .success h1 { color: #d82f6d; }
    .message { color: #5d5159; font-size: 18px; line-height: 1.5; }

    @media (max-width: 420px) {
      .card { min-height: 390px; padding: 34px 20px; }
      .emoji { font-size: 54px; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main class="card" id="questionCard">
    <div class="emoji">🐱 💗</div>
    <h1>Do you love me?</h1>

    <div class="buttons" id="buttonArea">
      <button id="yes">Yes 💕</button>
      <button id="no">No</button>
    </div>

    <div class="hint">(No is a little shy 😈)</div>
  </main>

  <main class="card success" id="successCard">
    <div class="emoji">🥰 💖</div>
    <h1>Yay! You said YES! 💕</h1>
    <p class="message">You just made my day!<br>Happy Valentine’s Day ❤️</p>
  </main>

  <script>
    const no = document.getElementById("no");
    const yes = document.getElementById("yes");
    const area = document.getElementById("buttonArea");
    const questionCard = document.getElementById("questionCard");
    const successCard = document.getElementById("successCard");

    function moveNoButton() {
      const rect = area.getBoundingClientRect();
      const btn = no.getBoundingClientRect();

      // Move within a safe viewport area.
      const maxX = Math.max(0, window.innerWidth - btn.width - 18);
      const maxY = Math.max(0, window.innerHeight - btn.height - 18);
      const x = Math.random() * maxX + 9;
      const y = Math.random() * maxY + 9;

      no.style.position = "fixed";
      no.style.left = x + "px";
      no.style.top = y + "px";
      no.style.zIndex = 10;
    }

    no.addEventListener("mouseenter", moveNoButton);
    no.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    }, {passive:false});
    no.addEventListener("click", moveNoButton);

    yes.addEventListener("click", () => {
      questionCard.style.display = "none";
      no.style.display = "none";
      successCard.style.display = "block";
      for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 60);
      }
    });

    function createHeart() {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = Math.random() > .35 ? "♡" : "♥";
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = (12 + Math.random() * 22) + "px";
      h.style.animationDuration = (4 + Math.random() * 5) + "s";
      document.getElementById("hearts").appendChild(h);
      setTimeout(() => h.remove(), 9500);
    }

    setInterval(createHeart, 650);
  </script>
</body>
</html>
